# data-zone / postgres-audit — SEPARATE audit instance on 5433 (postgres:16),
# append-only intent. Schema (audit_log + the UPDATE/DELETE-blocking rules) comes
# from postgres-audit-init, generated from docker/initdb/audit/01-init.sql.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-audit-credentials
  namespace: data-zone
  labels: {app.kubernetes.io/name: postgres-audit, zone: data-zone, tier: data}
type: Opaque
stringData:
  # Dev credentials, matching compose. Must match AUDIT_DB_URL in
  # data/endpoints.yaml. TODO: rotate + manage as a real Secret; a real
  # deployment also gives writers an INSERT-only role (append-only enforcement).
  POSTGRES_USER: audit_admin
  POSTGRES_PASSWORD: audit
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-audit
  namespace: data-zone
  labels: {app.kubernetes.io/name: postgres-audit, zone: data-zone, tier: data}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres-audit}
  ports:
    - {name: postgres, port: 5433, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-audit
  namespace: data-zone
  labels: {app.kubernetes.io/name: postgres-audit, zone: data-zone, tier: data}
spec:
  serviceName: postgres-audit
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres-audit}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres-audit, zone: data-zone, tier: data}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - {name: postgres, containerPort: 5433}
          env:
            - {name: POSTGRES_DB, value: soc_audit}
            # Distinct port so the two instances are never conflated, even when
            # the minimal overlay folds both into platform-zone.
            - {name: PGPORT, value: "5433"}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          envFrom:
            - secretRef: {name: postgres-audit-credentials}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
      volumes:
        - name: init
          configMap: {name: postgres-audit-init}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app.kubernetes.io/name: postgres-audit, zone: data-zone, tier: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        # TODO(Hyperstack): set storageClassName for the target cluster.
        # storageClassName: REPLACE_ME-hyperstack-storage-class
        resources:
          requests: {storage: 10Gi}
