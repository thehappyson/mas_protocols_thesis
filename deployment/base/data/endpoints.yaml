# data-endpoints — single source of truth for data-zone service DNS, one
# ConfigMap per consuming zone (envFrom'd by the MCP tool servers and the
# experiment harness).
#
# WHY THIS EXISTS: the minimal overlay folds data-zone into platform-zone,
# which changes these DNS names. Keeping them in exactly two ConfigMaps means
# the overlay rewrites two objects instead of hunting through every workload.
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-endpoints
  namespace: tool-zone
  labels:
    app.kubernetes.io/name: data-endpoints
    zone: tool-zone
data:
  OPERATIONAL_DB_HOST: postgres-operational.data-zone.svc.cluster.local
  OPERATIONAL_DB_PORT: "5432"
  AUDIT_DB_HOST: postgres-audit.data-zone.svc.cluster.local
  AUDIT_DB_PORT: "5433"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-endpoints
  namespace: experiment-zone
  labels:
    app.kubernetes.io/name: data-endpoints
    zone: experiment-zone
data:
  OPERATIONAL_DB_HOST: postgres-operational.data-zone.svc.cluster.local
  OPERATIONAL_DB_PORT: "5432"
  AUDIT_DB_HOST: postgres-audit.data-zone.svc.cluster.local
  AUDIT_DB_PORT: "5433"
