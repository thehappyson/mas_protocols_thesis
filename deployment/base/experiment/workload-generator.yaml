# experiment-zone / workload-generator — out-of-band labeled-alert generator.
# Writes alerts + agent-invisible ground truth straight to the operational DB;
# it is NOT an agent and has no inbound port, so it is a run-once JOB (not a
# Deployment+Service). This matches the compose service: `restart: no`, profile-
# gated, exits when its count/duration is reached. Re-run by deleting +
# re-applying the Job (or bumping WORKLOAD_SEED / a name suffix).
apiVersion: batch/v1
kind: Job
metadata:
  name: workload-generator
  namespace: experiment-zone
  labels: {app.kubernetes.io/name: workload-generator, zone: experiment-zone, tier: experiment}
spec:
  backoffLimit: 0            # deterministic run — do not retry on failure
  template:
    metadata:
      labels: {app.kubernetes.io/name: workload-generator, zone: experiment-zone, tier: experiment}
    spec:
      restartPolicy: Never
      containers:
        - name: generator
          image: soc-tool     # same shared tool image; psycopg2 already present
          command: ["python", "services/workload-generator/generator.py", "run"]
          env:
            - {name: WORKLOAD_RATE, value: "1.0"}
            - {name: WORKLOAD_ARRIVAL, value: "steady"}
            - {name: WORKLOAD_MIX, value: "benign:0.6,escalate:0.3,campaign:0.1"}
            - {name: WORKLOAD_SEED, value: "1337"}
            - {name: WORKLOAD_COUNT, value: "20"}
            - {name: WORKLOAD_CAMPAIGN_SIZE, value: "3"}
          envFrom:
            - configMapRef: {name: data-endpoints}   # OPERATIONAL_DB_URL
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
