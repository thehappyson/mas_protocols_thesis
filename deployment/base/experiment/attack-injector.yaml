# experiment-zone / attack-injector — attack-injection harness for the security
# side of the trade-off measurements (e.g. attempting direct data-zone access,
# replaying/forging capability tokens). Out-of-band/god-mode.
# Placeholder image: REPLACE_ME/attack-injector:dev
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attack-injector
  namespace: experiment-zone
  labels:
    app.kubernetes.io/name: attack-injector
    zone: experiment-zone
    tier: experiment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: attack-injector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attack-injector
        zone: experiment-zone
        tier: experiment
    spec:
      containers:
        - name: injector
          image: REPLACE_ME/attack-injector:dev
          env:
            - name: EXPERIMENT_CONTROLLER_ENDPOINT
              value: http://experiment-controller.experiment-zone.svc.cluster.local:8700
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.platform-zone.svc.cluster.local:4317
          envFrom:
            # Direct data-zone endpoints on purpose: the injector probes the
            # agent→data path that the protocol layer is supposed to gate.
            - configMapRef:
                name: data-endpoints
          # Unprofiled guesses — tune after first load tests.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
