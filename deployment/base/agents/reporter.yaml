# agent-zone / reporter-agent — A2A server on 9105 (files incident tickets).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter-agent
  namespace: agent-zone
  labels: {app.kubernetes.io/name: reporter-agent, zone: agent-zone, tier: agent}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: reporter-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: reporter-agent, zone: agent-zone, tier: agent}
    spec:
      containers:
        - name: agent
          image: soc-agent
          command: ["python", "services/reporter-agent/server.py"]
          ports:
            - {name: a2a, containerPort: 9105}
          env:
            - name: A2A_PUBLIC_URL
              value: "http://reporter-agent.agent-zone.svc.cluster.local:9105/"
          envFrom:
            - configMapRef: {name: agent-common-config}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: reporter-agent
  namespace: agent-zone
  labels: {app.kubernetes.io/name: reporter-agent, zone: agent-zone, tier: agent}
spec:
  selector: {app.kubernetes.io/name: reporter-agent}
  ports:
    - {name: a2a, port: 9105, targetPort: a2a}
