# agent-zone / triage-agent — A2A server on 9101 (workflow entry).
# Shared image soc-agent; inference is an external endpoint (agent-common-config).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-agent
  namespace: agent-zone
  labels: {app.kubernetes.io/name: triage-agent, zone: agent-zone, tier: agent}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: triage-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: triage-agent, zone: agent-zone, tier: agent}
    spec:
      containers:
        - name: agent
          image: soc-agent
          command: ["python", "services/triage-agent/server.py"]
          ports:
            - {name: a2a, containerPort: 9101}
          env:
            - name: A2A_PUBLIC_URL
              value: "http://triage-agent.agent-zone.svc.cluster.local:9101/"
          envFrom:
            - configMapRef: {name: agent-common-config}
          # Unprofiled guesses — tune after first load tests.
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: triage-agent
  namespace: agent-zone
  labels: {app.kubernetes.io/name: triage-agent, zone: agent-zone, tier: agent}
spec:
  selector: {app.kubernetes.io/name: triage-agent}
  ports:
    - {name: a2a, port: 9101, targetPort: a2a}
