# agent-zone / correlation-agent — A2A server on 9103.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: correlation-agent
  namespace: agent-zone
  labels: {app.kubernetes.io/name: correlation-agent, zone: agent-zone, tier: agent}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: correlation-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: correlation-agent, zone: agent-zone, tier: agent}
    spec:
      containers:
        - name: agent
          image: soc-agent
          command: ["python", "services/correlation-agent/server.py"]
          ports:
            - {name: a2a, containerPort: 9103}
          env:
            - name: A2A_PUBLIC_URL
              value: "http://correlation-agent.agent-zone.svc.cluster.local:9103/"
          envFrom:
            - configMapRef: {name: agent-common-config}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: correlation-agent
  namespace: agent-zone
  labels: {app.kubernetes.io/name: correlation-agent, zone: agent-zone, tier: agent}
spec:
  selector: {app.kubernetes.io/name: correlation-agent}
  ports:
    - {name: a2a, port: 9103, targetPort: a2a}
