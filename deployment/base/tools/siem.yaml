# tool-zone / mcp-siem — MCP streamable-HTTP server on 7001. Reads operational DB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-siem
  namespace: tool-zone
  labels: {app.kubernetes.io/name: mcp-siem, zone: tool-zone, tier: tool}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mcp-siem}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mcp-siem, zone: tool-zone, tier: tool}
    spec:
      containers:
        - name: server
          image: soc-tool
          command: ["python", "services/mcp-siem/server.py"]
          ports:
            - {name: mcp-http, containerPort: 7001}
          env:
            - {name: MCP_LISTEN_HOST, value: "0.0.0.0"}
            - {name: MCP_LISTEN_PORT, value: "7001"}
          envFrom:
            # OPERATIONAL_DB_URL only — the minimal overlay rewrites it in one place.
            - configMapRef: {name: data-endpoints}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-siem
  namespace: tool-zone
  labels: {app.kubernetes.io/name: mcp-siem, zone: tool-zone, tier: tool}
spec:
  selector: {app.kubernetes.io/name: mcp-siem}
  ports:
    - {name: mcp-http, port: 7001, targetPort: mcp-http}
