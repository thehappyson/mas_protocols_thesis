# tool-zone / mcp-containment — MCP streamable-HTTP server on 7006 (PRIVILEGED).
# AUDIT-WRITE tool: envFrom audit-endpoints ONLY. It holds the audit DSN and NOT
# the operational DSN, so it structurally cannot reach operational data — the
# same separation the compose service enforces (audit-db credential only).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-containment
  namespace: tool-zone
  labels: {app.kubernetes.io/name: mcp-containment, zone: tool-zone, tier: tool}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mcp-containment}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mcp-containment, zone: tool-zone, tier: tool}
    spec:
      containers:
        - name: server
          image: soc-tool
          command: ["python", "services/mcp-containment/server.py"]
          ports:
            - {name: mcp-http, containerPort: 7006}
          env:
            - {name: MCP_LISTEN_HOST, value: "0.0.0.0"}
            - {name: MCP_LISTEN_PORT, value: "7006"}
          envFrom:
            # AUDIT_DB_URL only — never the operational DSN.
            - configMapRef: {name: audit-endpoints}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-containment
  namespace: tool-zone
  labels: {app.kubernetes.io/name: mcp-containment, zone: tool-zone, tier: tool}
spec:
  selector: {app.kubernetes.io/name: mcp-containment}
  ports:
    - {name: mcp-http, port: 7006, targetPort: mcp-http}
