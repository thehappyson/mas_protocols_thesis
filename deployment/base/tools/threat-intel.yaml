# tool-zone / mcp-threat-intel — MCP tool server, streamable HTTP on 7003. Internals stubbed.
# Placeholder image: REPLACE_ME/mcp-threat-intel:dev
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-threat-intel
  namespace: tool-zone
  labels:
    app.kubernetes.io/name: mcp-threat-intel
    zone: tool-zone
    tier: tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-threat-intel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-threat-intel
        zone: tool-zone
        tier: tool
    spec:
      containers:
        - name: server
          image: REPLACE_ME/mcp-threat-intel:dev
          ports:
            - name: mcp-http
              containerPort: 7003
          env:
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: MCP_LISTEN_PORT
              value: "7003"
            - name: TTP_ENDPOINT
              value: https://trust-anchor.platform-zone.svc.cluster.local:8443
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.platform-zone.svc.cluster.local:4317
          envFrom:
            - configMapRef:
                name: data-endpoints
          # Unprofiled guesses — tune after first load tests.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-threat-intel
  namespace: tool-zone
  labels:
    app.kubernetes.io/name: mcp-threat-intel
    zone: tool-zone
    tier: tool
spec:
  selector:
    app.kubernetes.io/name: mcp-threat-intel
  ports:
    - name: mcp-http
      port: 7003
      targetPort: mcp-http
