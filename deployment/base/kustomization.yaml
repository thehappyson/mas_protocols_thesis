# =============================================================================
# soc-testbed — BASE (full 5-zone topology, every workload at replica 1)
#
# This base is the shared topology for the "basic" and "scaled" tiers.
# The "minimal" tier lives in overlays/minimal/ and is the ONLY tier allowed
# to deviate structurally (it folds data-zone into platform-zone), which is
# exactly why minimal is non-reportable.
#
# NETWORKING — CRITICAL DESIGN POINT:
#   Cross-zone access is OPEN BY DEFAULT. This base deliberately contains NO
#   restrictive NetworkPolicies. Agents must be able to *attempt* direct
#   data-zone access so that enforcement by the protocol layer (MCP/A2A/ANP
#   capability tokens) can be observed as the experimental variable.
#   Restrictive policies exist as an OPT-IN Kustomize component at
#   components/network-policies/ — include it from an overlay only when
#   "network-policy: on" is the desired experimental condition.
#   NOTE: NetworkPolicy objects are inert unless the cluster CNI enforces
#   them — verify CNI enforcement on the target cluster before relying on
#   the "on" condition (see components/network-policies/kustomization.yaml).
#
# PLACEHOLDERS YOU MUST FILL BEFORE DEPLOYING (grep for REPLACE_ME / TODO):
#   Images (no registry guessed):
#     REPLACE_ME/soc-triage-agent:dev          agents/triage.yaml
#     REPLACE_ME/soc-enrichment-agent:dev      agents/enrichment.yaml
#     REPLACE_ME/soc-correlation-agent:dev     agents/correlation.yaml
#     REPLACE_ME/soc-response-agent:dev        agents/response.yaml
#     REPLACE_ME/soc-reporter-agent:dev        agents/reporter.yaml
#     REPLACE_ME/inference-runtime:dev         all agents (Ollama or vLLM sidecar)
#     REPLACE_ME/mcp-siem:dev … etc.           tools/*.yaml (6 images)
#     REPLACE_ME/trust-anchor:dev              platform/trust-anchor.yaml
#     REPLACE_ME/service-registry:dev          platform/registry.yaml
#     REPLACE_ME/workload-generator:dev … etc. experiment/*.yaml (4 images)
#   Hyperstack specifics (not guessed):
#     storageClassName for Postgres PVCs       data/*.yaml (TODO, commented)
#     ingress / external exposure              none created — TODO if needed
#     node pools / GPU scheduling for sidecars TODO, no nodeSelector set
#   Secrets:
#     Postgres credentials                     data/*.yaml (placeholder Secrets)
#   Resource requests/limits are UNPROFILED GUESSES throughout — tune later.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Do NOT set a global `namespace:` here — resources span 5 namespaces and each
# declares its own. A global namespace would silently collapse the topology.

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: soc-testbed

resources:
  - namespaces.yaml
  # ---- agent-zone: 5 agents (A2A servers 9101-9105, LLM inference sidecar) ----
  - agents/triage.yaml
  - agents/enrichment.yaml
  - agents/correlation.yaml
  - agents/response.yaml
  - agents/reporter.yaml
  # ---- tool-zone: 6 MCP tool servers over streamable HTTP (7001-7006) ----
  - tools/siem.yaml
  - tools/cmdb.yaml
  - tools/threat-intel.yaml
  - tools/runbook.yaml
  - tools/ticketing.yaml
  - tools/containment.yaml
  # ---- platform-zone: TTP (8443), service registry (8500), otel (4317) ----
  - platform/trust-anchor.yaml
  - platform/registry.yaml
  - platform/otel-collector.yaml
  # ---- data-zone: operational pg (5432, pgvector), audit pg (5433) ----
  # (Memgraph is an OFFLINE analysis instrument — intentionally not deployed.)
  - data/postgres-operational.yaml
  - data/postgres-audit.yaml
  # Single source of truth for data-zone service DNS, per consuming zone.
  # The minimal overlay rewrites these when it folds data-zone into platform-zone.
  - data/endpoints.yaml
  # ---- experiment-zone: out-of-band harness, not subject to protocol overhead ----
  - experiment/workload-generator.yaml
  - experiment/attack-injector.yaml
  - experiment/experiment-controller.yaml
  - experiment/metrics-sink.yaml
