# One-time operational-DB seed loader. Pulls the bulk seed_*.sql that
# scripts/stage_dbs.py generated + uploaded to the model bucket subfolder
# (s3://model-storage/db-seed/) and psql-loads it into postgres-operational.
#
# NAMESPACE-PORTABLE: this manifest declares NO namespace and uses the SHORT DB
# host `postgres-operational` (same-namespace DNS). The kustomize overlays under
# ../minimal and ../reportable set the namespace to wherever Postgres lives
# (platform-zone for minimal, data-zone for reportable) — so there is no `sed`.
#
# PREREQS in that namespace:
#   * postgres-operational is Running and its schema exists (the initdb ConfigMap
#     ran on first start);
#   * a `vllm-s3-creds` Secret (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) — the
#     SAME object-storage creds used elsewhere, created out-of-band because it
#     holds credentials (never committed, so not overlay-managed).
#
# Apply / watch / clean up (pick the overlay matching your deployed tier):
#   kubectl apply  -k deployment/db-seed/reportable
#   kubectl -n data-zone logs -f job/db-seed          # -> "db-seed complete"
#   kubectl delete -k deployment/db-seed/reportable
apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      initContainers:
        # 1) block until the operational DB accepts connections
        - name: wait-for-db
          image: postgres:16
          command: ["sh", "-c"]
          args:
            - 'for i in $(seq 1 60); do pg_isready -d "$OPERATIONAL_DB_URL" && exit 0; sleep 2; done; echo "db not ready" >&2; exit 1'
          env:
            - {name: OPERATIONAL_DB_URL, value: "postgresql://soc:soc@postgres-operational:5432/soc_operational"}
        # 2) download the seed from the bucket subfolder into a shared dir.
        #    quay mirror — Docker Hub's minio/mc hits anonymous-pull rate limits.
        - name: fetch-seed
          image: quay.io/minio/mc
          command: ["sh", "-c"]
          args:
            - 'mc alias set hs "$AWS_ENDPOINT_URL" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" && mc cp --recursive hs/model-storage/db-seed/ /seed/ && ls -la /seed'
          env:
            - {name: AWS_ENDPOINT_URL, value: "https://ca1.obj.nexgencloud.io"}
          envFrom:
            - secretRef: {name: vllm-s3-creds}   # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - {name: seed, mountPath: /seed}
      containers:
        # 3) load the SQL — ORDER MATTERS: alert_ground_truth references alerts(id),
        #    so alerts must load before ground_truth. iocs/assets are independent.
        - name: loader
          image: postgres:16
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for f in iocs assets alerts ground_truth; do
                echo "== loading seed_$f.sql =="
                psql "$OPERATIONAL_DB_URL" -v ON_ERROR_STOP=1 -f "/seed/seed_$f.sql"
              done
              psql "$OPERATIONAL_DB_URL" -c "SELECT
                (SELECT count(*) FROM alerts)             AS alerts,
                (SELECT count(*) FROM iocs)               AS iocs,
                (SELECT count(*) FROM assets)             AS assets,
                (SELECT count(*) FROM alert_ground_truth) AS ground_truth;"
              echo "db-seed complete"
          env:
            - {name: OPERATIONAL_DB_URL, value: "postgresql://soc:soc@postgres-operational:5432/soc_operational"}
          volumeMounts:
            - {name: seed, mountPath: /seed}
      volumes:
        - name: seed
          emptyDir: {}
