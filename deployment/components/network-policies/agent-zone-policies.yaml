# agent-zone under "network-policy: on": agents accept A2A traffic from peers
# in the same zone plus the experiment harness (workload injection, god-mode).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-zone-restrict-ingress
  namespace: agent-zone
  labels:
    zone: agent-zone
    app.kubernetes.io/part-of: soc-testbed
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              zone: agent-zone
        - namespaceSelector:
            matchLabels:
              zone: experiment-zone
