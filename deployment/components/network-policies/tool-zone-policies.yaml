# tool-zone under "network-policy: on": MCP servers accept calls only from
# agent-zone (the sanctioned callers) and experiment-zone (god-mode).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tool-zone-restrict-ingress
  namespace: tool-zone
  labels:
    zone: tool-zone
    app.kubernetes.io/part-of: soc-testbed
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              zone: agent-zone
        - namespaceSelector:
            matchLabels:
              zone: experiment-zone
        - namespaceSelector:
            matchLabels:
              zone: tool-zone
