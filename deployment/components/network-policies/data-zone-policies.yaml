# THE key policy of the "network-policy: on" condition: closes the direct
# agent→data path. With this active, only tool-zone (sanctioned MCP path) and
# experiment-zone (god-mode) can reach the databases; agent-zone attempts at
# direct data access are dropped at the network layer instead of being caught
# (or missed) by the protocol layer.
# Ingress-only restriction by design: egress stays open everywhere to avoid
# breaking DNS and to keep the variable a single, clean "who may reach the
# data zone" toggle.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-zone-restrict-ingress
  namespace: data-zone
  labels:
    zone: data-zone
    app.kubernetes.io/part-of: soc-testbed
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              zone: tool-zone
        - namespaceSelector:
            matchLabels:
              zone: experiment-zone
        # Intra-zone traffic stays allowed.
        - namespaceSelector:
            matchLabels:
              zone: data-zone
